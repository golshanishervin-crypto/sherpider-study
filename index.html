<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <script>
  function showErr(t) {
    var el = document.createElement('pre')
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;margin:0;padding:12px;background:#7f0000;color:#fff;font-size:12px;white-space:pre-wrap;z-index:99999;overflow:auto'
    el.textContent = t
    document.body.appendChild(el)
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target !== window && (e.target.src || e.target.href)) {
      showErr('LOAD FAILED: ' + (e.target.src || e.target.href))
      return
    }
    showErr('ERROR: ' + (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || ''))
  }, true)
  window.addEventListener('unhandledrejection', function (e) {
    showErr('PROMISE: ' + String(e.reason))
  })
</script>
